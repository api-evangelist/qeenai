source: >-
  https://github.com/fodoole/qeen-mobile-sdk-ios (SwiftPM),
  https://github.com/fodoole/qeen-maven (Maven), https://cdn.qeen.ai/ (GCS bucket "qeen-public")
note: >-
  Qeen publishes no package on npm, PyPI, RubyGems, crates.io, Packagist, NuGet or Maven Central.
  Its first-party client libraries are distributed from two places instead: two self-hosted
  repositories under the "fodoole" GitHub organization (Fodoole is the company's earlier name — the
  loader served from Qeen's own cdn.qeen.ai sets window.fodooleMutex and localStorage "fodoole_uid",
  and the fodoole org publishes artifacts under the ai.qeen group id with tech@qeen.ai as contact),
  and a public Google Cloud Storage bucket at cdn.qeen.ai for the browser SDK.

