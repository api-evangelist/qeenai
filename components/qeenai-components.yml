preview_mode:
  description: >-
    The web SDK ships a documented-in-code preview channel used by Qeen's own dashboard to render
    proposed content into a live merchant page.
  flags:
    - {flag: '#no-qeen', effect: 'Disables the SDK on the page and opens a postMessage listener accepting {action:"renderDemoContent", domPath, content} and {action:"scrollToTarget", domPath}'}
