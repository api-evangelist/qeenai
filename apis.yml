name: Qeen.AI
description: 'Qeen.AI is an AI-powered digital marketing ecosystem for e-commerce brands
  across the GCC and wider MENA region. Founded in 2023 and headquartered in the UAE,
  the company pairs machine learning with human marketing expertise to run strategy,
  paid-media execution, creative production, and continuous optimization on a performance
  basis (no retainers, commission starting at 5% of generated revenue). Its founding
  team includes former Google and DeepMind researchers, and it has raised roughly $12M,
  including backing from Prosus Ventures. Qeen.AI operates a customer application at
  app.qeen.ai but does not currently publish a public developer portal, API documentation,
  SDKs, or an OpenAPI surface.'
