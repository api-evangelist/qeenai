name: Qeen.AI
description: 'Qeen (qeen.ai) is a Dubai-based AI company serving e-commerce brands across the GCC
  and wider MENA region. Founded in 2023 by former Google and DeepMind researchers and backed by a
  $10M seed led by Prosus Ventures ($12M total), it sells two things: a self-serve
  content-optimization product that generates, localizes and A/B-tests Arabic and English product
  titles, descriptions and meta descriptions, and a commission-based growth marketing engagement
  priced at 5% of generated revenue with no retainer. Qeen publishes no OpenAPI, no developer
  portal and no public API reference. Its machine-readable surface is three first-party client
  SDKs — a binary Swift package for iOS and an Android AAR, both at 1.5.0 and shipping roughly
  weekly, plus a browser SDK and embedded search widget served from its own CDN. Ingestion
  credentials (an API key and a customer-provisioned host) are issued privately by email rather
  than through self-service, and the customer platform API at users.qeen.ai is a session-gated
  Django REST Framework backend for the web application rather than a developer API.'
