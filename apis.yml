apis:
- name: Qeen Mobile Analytics SDK
  description: >-
    Qeen's first-party mobile analytics and commerce-event SDK, shipped as a binary XCFramework for
    iOS (Swift Package Manager) and an AAR for Android (self-hosted Maven). It exposes a typed
    commerce event vocabulary — productViewed, addToCart, cartUpdated, couponApplied, cartCleared,
    checkoutStarted, paymentMethodSet, shippingDetailsSet, orderPlaced, orderCompleted,
    orderRefunded, signedIn, signedUp — alongside freeform track(), identify(), screen(), flush()
    and reset(). Every monetary amount is a Money value carrying an ISO 4217 currency and every
    product line is a LineItem, so a currency-less price is not expressible. Deep links are
    forwarded to the SDK and every utm_* and *clid parameter is captured for server-side
    attribution. The analytics engine is PostHog, compiled into the framework and hidden behind
    Qeen's own API.
  humanURL: https://github.com/fodoole/qeen-mobile-sdk-ios
  baseURL: https://{host}
  x-base-url-note: >-
    Templated and correct as published. The SDK has no default ingestion endpoint — the README
    documents configure(apiKey:host:) and states that the host and API key "are shared privately
    by email — contact tech@qeen.ai". Recording a concrete host here would be a guess.
  tags:
  - Analytics
  - Mobile SDK
  - Ecommerce
  - Attribution
  properties:
  - type: SourceCode
    url: https://github.com/fodoole/qeen-mobile-sdk-ios
  - type: Documentation
