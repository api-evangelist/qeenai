- name: Qeen Web Content and Analytics API
  description: >-
    The browser-side data plane the published qeen.js SDK and loader snippet call. The loader
    hashes the page URL and a persisted device id and requests a per-page content-replacement
    script; the SDK then fetches optimized content, receives project, website and content-serving
    identifiers from a server-supplied client config, and beacons interaction events (PAGE_VIEW,
    CLICK, SCROLL, IDLE, CHECKOUT, CONTENT_SERVED, TAB_SWITCH, PAGE_EXIT) with
    navigator.sendBeacon. The same host backs the embedded qeenSearch widget through /search-results
    and /search-logging. Endpoints answer anonymously and are bound to a site rather than
    authenticated with a bearer credential.
  humanURL: https://cdn.qeen.ai/sdk/qeen.js
  baseURL: https://fodoole-web-analytics-qfan6cresq-ew.a.run.app
  x-base-url-note: >-
    Observed, not guessed — this host is hardcoded in the first-party SDK and loader bundles Qeen
    serves from its own cdn.qeen.ai. "Fodoole" is the company's earlier name; the loader on
    Qeen's CDN sets window.fodooleMutex and a "fodoole_uid" device id, and the same org name
    carries the GitHub repositories that publish artifacts under the ai.qeen group id.
  tags:
  - Analytics
  - Content Optimization
  - Personalization
  - Search
  properties:
  - type: Components
    url: components/qeenai-components.yml
  - type: ErrorCatalog
    url: errors/qeenai-error-codes.yml

- name: Qeen Customer Platform API
  description: >-
    The backend the Qeen customer web application (app.qeen.ai, a Nuxt single-page app) calls — a
    path-versioned Django REST Framework service covering websites, content, organizations and
    subscriptions, plus token verify and refresh endpoints. It is the product's own session
    surface rather than a developer API: requests are made with cookie credentials from the first-
    party front end, unauthenticated calls return DRF's standard 401, and no schema, key issuance
    or documentation is published for it.
  humanURL: https://app.qeen.ai/en
  baseURL: https://users.qeen.ai/api/v1
  tags:
  - Platform
  - Subscriptions
  properties:
  - type: Authentication
    url: authentication/qeenai-authentication.yml
  - type: ErrorCatalog
    url: errors/qeenai-error-codes.yml
