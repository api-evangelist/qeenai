note: >-
  Qeen sells through two different commercial models and publishes prices for only one of them.
  The self-serve product (the Shopify content-optimization app) has public per-tier pricing; the
  company's own website sells a services engagement priced as a revenue share with no published
  rate card beyond a floor. Both are captured, and the currency is USD in both cases. There is no
  API pricing and no developer plan — the SDKs are entitlements of a paid account, with the host
  and API key provisioned by email.

