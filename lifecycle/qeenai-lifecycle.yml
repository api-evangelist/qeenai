    scheme: semver
    current: 1.5.0
    released: '2026-08-12'
    first_release: '2026-07-23'
    releases: 8
    docs: https://github.com/fodoole/qeen-mobile-sdk-ios
  android_sdk:
    scheme: semver
    current: 1.5.0
    released: '2026-08-12'
    metadata: https://raw.githubusercontent.com/fodoole/qeen-maven/main/ai/qeen/qeensdk/maven-metadata.xml
  web_sdk:
    scheme: major-line CDN path
    current: '1.0'
    released: '2025-10-29'
    note: >-
      Neither /sdk/qeen.js nor /sdk/v1.0/qeen.js is patch-pinned; a consumer cannot express a
      version constraint and silently takes any future 1.0.x build.
  platform_api:
    scheme: uri-path
    current: v1
    example: https://users.qeen.ai/api/v1/

