note: >-
  Qeen publishes no versioning policy page, no deprecation policy, no SLA and no status page. What
  it does publish is a tagged, dated, semver release history for both mobile SDKs, and a
  path-versioned platform API. Absences below are recorded because they were checked, not assumed.

